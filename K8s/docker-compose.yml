version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: vprofile-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vprofiledb
      MYSQL_USER: vprofile
      MYSQL_PASSWORD: vprofile123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vprofile-network

  # VProfile Application
  vprofile-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vprofile-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vprofiledb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: vprofile
      SPRING_DATASOURCE_PASSWORD: vprofile123
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - vprofile-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local

networks:
  vprofile-network:
    driver: bridge
