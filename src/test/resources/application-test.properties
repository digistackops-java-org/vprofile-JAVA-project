# Test Configuration for VProfile Application

# Server Configuration
server.port=0

# Database Configuration - H2 In-Memory for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.root=INFO
logging.level.com.visualpathit=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration
spring.security.user.name=testuser
spring.security.user.password=testpass

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Memcached Configuration (Disabled for tests)
memcached.enabled=false
memcached.servers=localhost:11211

# RabbitMQ Configuration (Disabled for tests unless specifically needed)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# ElasticSearch Configuration (Disabled for tests)
elasticsearch.enabled=false
elasticsearch.host=localhost
elasticsearch.port=9200

# Test-specific settings
spring.test.mockmvc.print=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Cache Configuration
spring.cache.type=none

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration
spring.session.store-type=none

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# JWT Configuration (for testing)
jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironment
jwt.expiration=3600000
